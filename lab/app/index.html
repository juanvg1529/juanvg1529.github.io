<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediCita · App de demostración</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <span class="logo" aria-hidden="true">✚</span>
    <strong>MediCita</strong>
    <nav class="app-nav" id="app-nav" aria-label="Menú" hidden>
      <span id="greeting" data-testid="greeting"></span>
      <a href="#/doctors">Médicos</a>
      <a href="#/appointments">Mis citas</a>
      <button type="button" id="logout">Salir</button>
    </nav>
  </header>
  <main id="view" class="app-main" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">¿Cancelar la cita?</h2>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button type="button" id="modal-no" class="secondary">No, mantener</button>
        <button type="button" id="modal-yes" class="danger">Sí, cancelar</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
