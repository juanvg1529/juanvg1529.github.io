name: Site tests & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 13 * * *" # daily: refreshes the live dashboard and catches broken links
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test site (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Build the lab's Playwright report (published at /lab/report/)
        if: always()
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: lab-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/lab-app.spec.ts --project=desktop --reporter=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: lab-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dashboard data from GitHub Actions
        # If the API call fails, the snapshot committed in data/ is published instead.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-stats.mjs
      - name: Collect site files
        run: mkdir _site && cp index.html styles.css i18n.js terminal.js dashboard.js bughunt.js _site/ && cp -r data cv lab _site/
      - uses: actions/download-artifact@v4
        with:
          name: lab-report
          path: _site/lab/report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  smoke-live:
    name: Test live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests against https://juanvg1529.github.io
        env:
          SITE_URL: https://juanvg1529.github.io
        run: npx playwright test
